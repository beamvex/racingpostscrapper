name: Terraform (OIDC)

on:
  push:
    branches:
      - main
    
  pull_request:
    
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Ensure ECR repository exists
        env:
          ECR_REPOSITORY: racingpost-scrapper
        run: |
          set -euo pipefail
          if aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            echo "ECR repository exists: $ECR_REPOSITORY"
          else
            echo "Creating ECR repository: $ECR_REPOSITORY"
            aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
          fi

      - name: Login to Amazon ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin 512752756525.dkr.ecr.eu-west-2.amazonaws.com

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            512752756525.dkr.ecr.eu-west-2.amazonaws.com/racingpost-scrapper:${{ github.sha }}
            512752756525.dkr.ecr.eu-west-2.amazonaws.com/racingpost-scrapper:latest
          cache-from: type=registry,ref=512752756525.dkr.ecr.eu-west-2.amazonaws.com/racingpost-scrapper:buildcache
          cache-to: type=registry,ref=512752756525.dkr.ecr.eu-west-2.amazonaws.com/racingpost-scrapper:buildcache,mode=max

  terraform:
    runs-on: ubuntu-latest
    needs: docker
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false
